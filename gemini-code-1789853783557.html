    <title>اختبار وحدة الأعداد النسبية والحقيقية التفاعلي</title>

    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 26px;
        }

        .section-tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
            background: #cbd5e1;
        }

        .quiz-section {
            display: none;
        }

        .quiz-section.active {
            display: block;
        }

        .question-card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid #cbd5e1;
            transition: all 0.2s;
            font-size: 15px;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background: #f8fafc;
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background: #dbeafe;
        }

        .option-item.correct {
            border-color: var(--success-color);
            background: #dcfce7;
            color: var(--success-color);
            font-weight: bold;
        }

        .option-item.incorrect {
            border-color: var(--error-color);
            background: #fee2e2;
            color: var(--error-color);
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: var(--secondary-color);
        }

        .alert-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }

        .score-display {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: right;
            font-size: 16px;
            line-height: 1.8;
        }

        .score-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--secondary-color);
            text-align: center;
            margin-bottom: 10px;
        }

        .feedback-box-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            color: #166534;
            font-weight: bold;
        }

        .feedback-box-excel {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            color: #1e40af;
            font-weight: bold;
        }

        .feedback-box-retry {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            color: #92400e;
        }

        .concept-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            color: var(--text-color);
        }

        .concept-box ul {
            margin: 5px 0 0 0;
            padding-right: 20px;
        }
    </style>
</head>

    function renderTabs() {
        const tabsContainer = document.getElementById('tabs-container');
        tabsContainer.innerHTML = '';
        quizData.forEach((sec, idx) => {
            const btn = document.createElement('button');
            const isUnlocked = idx === 0 || sectionCompleted[idx - 1] || sectionCompleted[idx];
            btn.className = `tab-btn ${idx === currentSection ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
            btn.innerText = sec.title;
            btn.onclick = () => {
                if (isUnlocked) {
                    switchSection(idx);
                } else {
                    showAlert("يجب إكمال وحل جميع أسئلة القسم السابق أولاً للانتقال هنا!");
                }
            };
            tabsContainer.appendChild(btn);
        });
    }

    function renderQuiz() {
        renderTabs();
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        quizData.forEach((sec, sIdx) => {
            const secDiv = document.createElement('div');
            secDiv.className = `quiz-section ${sIdx === currentSection ? 'active' : ''}`;
            secDiv.id = `section-${sIdx}`;

            let html = `<h2>${sec.title}</h2>`;
            sec.questions.forEach((q, qIdx) => {
                html += `
                    <div class="question-card">
                        <div class="question-title">س${qIdx + 1}: ${q.q}</div>
                        <ul class="options-list">
                `;
                q.options.forEach((opt, oIdx) => {
                    const isSelected = userAnswers[sIdx] && userAnswers[sIdx][qIdx] === oIdx ? 'selected' : '';
                    html += `<li class="option-item ${isSelected}" onclick="selectOption(${sIdx}, ${qIdx}, ${oIdx})">${opt}</li>`;
                });
                html += `</ul></div>`;
            });
            secDiv.innerHTML = html;
            container.appendChild(secDiv);
        });

        if (sectionCompleted[currentSection]) {
            showScoreUI(currentSection);
        } else {
            document.getElementById('score-result').innerHTML = '';
        }

        if (window.MathJax) {
            MathJax.typeset();
        }
    }

    function switchSection(index) {
        currentSection = index;
        document.getElementById('alert-msg').style.display = 'none';
        renderQuiz();
    }

    function selectOption(secIdx, qIdx, optIdx) {
        if (!userAnswers[secIdx]) {
            userAnswers[secIdx] = {};
        }
        userAnswers[secIdx][qIdx] = optIdx;
        renderQuiz();
    }

    function showAlert(msg) {
        const alertBox = document.getElementById('alert-msg');
        alertBox.innerText = msg;
        alertBox.style.display = 'block';
    }

    function checkAnswers() {
        const currentSecQuestions = quizData[currentSection].questions.length;
        const answeredCount = userAnswers[currentSection] ? Object.keys(userAnswers[currentSection]).length : 0;

        if (answeredCount < currentSecQuestions) {
            showAlert("الرجاء الإجابة على جميع أسئلة القسم الحالي أولاً لعرض النتيجة!");
            return;
        }

        document.getElementById('alert-msg').style.display = 'none';
        sectionCompleted[currentSection] = true;

        let currentSecScore = 0;
        quizData[currentSection].questions.forEach((q, qIdx) => {
            const card = document.querySelectorAll(`#section-${currentSection} .question-card`)[qIdx];
            const options = card.querySelectorAll('.option-item');
            const userAns = userAnswers[currentSection][qIdx];

            options.forEach((opt, oIdx) => {
                opt.classList.remove('correct', 'incorrect');
                if (oIdx === q.correct) {
                    opt.classList.add('correct');
                } else if (oIdx === userAns) {
                    opt.classList.add('incorrect');
                }
            });

            if (userAns === q.correct) {
                currentSecScore++;
            }
        });

        showScoreUI(currentSection, currentSecScore);
        renderTabs();
    }
